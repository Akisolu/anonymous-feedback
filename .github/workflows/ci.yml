name: CI Suite

on:
  push:
    branches: [ main, master, "feature/*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  phpunit:
    name: PHPUnit Tests (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ['8.4']

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: feedback
          POSTGRES_USER: feedback_user
          POSTGRES_PASSWORD: password123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo, pdo_pgsql, redis, mbstring, ctype, iconv, zip
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Create .env file for Testing
        run: |
          cat <<EOF > .env
          APP_NAME="Anonymous Feedback System"
          APP_ENV=testing
          APP_DEBUG=true
          APP_URL=http://localhost:8000
          DB_DRIVER=pgsql
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_DATABASE=feedback
          DB_USERNAME=feedback_user
          DB_PASSWORD=password123
          DB_CHARSET=utf8
          DB_SCHEMA=public
          REDIS_SCHEME=tcp
          REDIS_HOST=127.0.0.1
          REDIS_PORT=6379
          RATE_LIMIT_MAX_REQUESTS=10
          RATE_LIMIT_DECAY=600
          EOF

      - name: Grant Schema Permissions on PostgreSQL 15
        env:
          PGPASSWORD: password123
        run: |
          psql -h 127.0.0.1 -U feedback_user -d feedback -c "GRANT ALL ON SCHEMA public TO feedback_user;"

      - name: Run Database Migrations
        run: php bin/migrate.php

      - name: Run PHPUnit Tests
        run: vendor/bin/phpunit